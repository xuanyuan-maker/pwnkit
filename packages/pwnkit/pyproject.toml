[project]
name = "pwnkit"
version = "0.1.0"
description = "A personal collection of pwn utilities."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pwnkit = "pwnkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwnkit"]
